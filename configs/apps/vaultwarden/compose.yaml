services:
  vaultwarden:
    image: docker.io/vaultwarden/server:1.37.4
    container_name: vaultwarden
    restart: always
    ports:
      - "127.0.0.1:8222:80"
    volumes:
      - ./data:/data
    environment:
      - DOMAIN=${DOMAIN}
      - ADMIN_TOKEN=${ADMIN_TOKEN}
      - SIGNUPS_ALLOWED=false
